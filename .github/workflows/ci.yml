# Every action is pinned to a full commit SHA (supply chain). The comment after each
# SHA names its release; update both together.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must equal the wasm-bindgen version in Cargo.lock; scripts/build-wasm.mjs checks.
  WASM_BINDGEN_VERSION: 0.2.129
  CARGO_DENY_VERSION: 0.20.2

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Licence headers
        run: cargo xtask check-headers
      # Runs on both OSes, which also proves the generator is byte-identical across them.
      - name: Fixtures match the generator
        run: cargo xtask check-fixtures

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Licences, advisories, duplicate crates, sources
        run: cargo deny --locked check

  wasm-and-ts:
    name: wasm and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build wasm
        run: pnpm build:wasm
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - name: Task-pane and My documents budgets (decisions 0010 and 0015)
        run: pnpm budgets

  family-app-e2e:
    name: My documents in a browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No browser download: the runner's own Google Chrome (channel "chrome").
      - name: Playwright against the test accounts (cargo xtask accounts)
        env:
          CI: "true"
        run: pnpm --filter @lineage/family-app e2e

  fuzz:
    name: Fuzz the readers (short)
    runs-on: ubuntu-latest
    env:
      # Without --target, cargo-fuzz builds for the platform its own binary was
      # built for, and install-action's binary is a musl build. AddressSanitizer
      # needs the runner's glibc target.
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer needs nightly. Pinned to a date so runs are reproducible.
      - name: Install a pinned nightly
        run: rustup toolchain install nightly-2026-10-01 --profile minimal
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      - name: Seed the corpus with the fixtures
        run: mkdir -p fuzz/corpus/docx_reader fuzz/corpus/zip_reader && cp fixtures/docx/synthetic/*.docx fuzz/corpus/docx_reader/ && cp fixtures/docx/synthetic/*.docx fuzz/corpus/zip_reader/
      - name: docx_reader for 60 seconds
        run: cargo +nightly-2026-10-01 fuzz run docx_reader --target "$FUZZ_TARGET" -- -max_total_time=60
      - name: zip_reader for 30 seconds
        run: cargo +nightly-2026-10-01 fuzz run zip_reader --target "$FUZZ_TARGET" -- -max_total_time=30

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit in the pull request is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $commit has no Signed-off-by line. Use 'git commit -s'."
              missing=1
            fi
          done
          exit "$missing"
