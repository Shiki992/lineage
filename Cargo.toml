[workspace]
resolver = "3"
# The fuzz targets are their own workspace (they need nightly).
exclude = ["fuzz"]
members = [
    "crates/core",
    "crates/lineage",
    "crates/wasm",
    "crates/harness",
    "crates/testkit",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Shiki992/lineage"
authors = ["Hrishikesh Vedantam"]
publish = false

[workspace.dependencies]
lineage-core = { path = "crates/core" }
lineage = { path = "crates/lineage" }
lineage-testkit = { path = "crates/testkit" }
lineage-harness = { path = "crates/harness" }
# Exact pin: wasm-bindgen-cli must match this version exactly (see scripts/build-wasm.mjs).
wasm-bindgen = "=0.2.129"
# Engine: zip reading, deflate and XML. Chosen in docs/decisions/0005-docx-package-and-xml.md.
rawzip = "0.5.2"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }
# Streaming XML for worksheets, which can be far too large for a tree. Justified in
# docs/decisions/0025-phase-5-dependencies-and-budgets.md.
quick-xml = { version = "0.42.0", default-features = false }
# Content addressing and change ids. Justified in docs/decisions/0006-phase-1-dependencies.md.
sha2 = { version = "0.11.1", default-features = false }
# The change list (spec/format) and the ledger are JSON. Justified in 0006.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dev-only: JSON Schema checks for spec/format and an independent zip reader for fixtures.
boon = "0.6.1"
# Dev-only: property tests. No default features, so no fork or tempfile (0006).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
zip = { version = "9.0.3", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The task pane's engine (scripts/build-wasm.mjs). Smallest code: with decks
# (Phase 4), 1,406 KB raw and 467 KB gzipped, against budgets of 4 MB (decision 0010).
[profile.wasm]
inherits = "release"
opt-level = "z"
