[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/lineage",
    "crates/wasm",
    "crates/harness",
    "crates/testkit",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Shiki992/lineage"
authors = ["Hrishikesh Vedantam"]
publish = false

[workspace.dependencies]
lineage-core = { path = "crates/core" }
lineage = { path = "crates/lineage" }
lineage-testkit = { path = "crates/testkit" }
# Exact pin: wasm-bindgen-cli must match this version exactly (see scripts/build-wasm.mjs).
wasm-bindgen = "=0.2.129"
# Engine: zip reading, deflate and XML. Chosen in docs/decisions/0005-docx-package-and-xml.md.
rawzip = "0.5.2"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }
# Content addressing and change ids. Justified in docs/decisions/0006-phase-1-dependencies.md.
sha2 = { version = "0.11.1", default-features = false }
# The change list (spec/format) and the ledger are JSON. Justified in 0006.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dev-only: JSON Schema checks for spec/format and an independent zip reader for fixtures.
boon = "0.6.1"
zip = { version = "9.0.3", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Small wasm bundles for the task pane. Size budgets are set in Phase 2.
opt-level = "s"
lto = true
codegen-units = 1
