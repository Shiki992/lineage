[package]
name = "lineage-testkit"
description = "Test-only builder for synthetic .docx and .pptx files, used by the fixture generator and engine tests. Never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Deflate for the fixtures that are compressed the way Word saves.
miniz_oxide.workspace = true

[dev-dependencies]
# An independent zip reader, so fixture tests don't trust our own writer.
zip = { workspace = true, features = ["deflate-flate2"] }
flate2.workspace = true
