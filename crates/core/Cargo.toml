[package]
name = "lineage-core"
description = "Lineage document engine: package reading, canonical models, diff, three-way merge and writers. Pure, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rawzip.workspace = true
miniz_oxide.workspace = true
roxmltree.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
boon.workspace = true
lineage-testkit.workspace = true
# An independent zip reader with its own inflater, so package tests don't trust our code.
zip = { workspace = true, features = ["deflate-flate2"] }
flate2.workspace = true
